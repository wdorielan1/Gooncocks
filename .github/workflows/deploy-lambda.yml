name: Deploy Lambda

on:
  push:
    branches: [claude/yahoo-fantasy-recap-setup-nimcop]
    paths:
      - "*.py"
      - "landing.html"
      - "*.webp"
      - "rivalry-center/**"
      - "manager-career-center/**"
      - "record-room/**"
      - "shared/**"
      - "trade-lab/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-lambda
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  FUNCTION_NAME: gooncockfantasy
  TRADE_LAB_FUNCTION: gooncocks-trade-lab
  SITE_BUCKET: gooncocks-recap-891823750306-us-east-2-an
  LAMBDA_FILES: lambda_function.py awards.py webpage.py yahoo_client.py discord_client.py sample_data.py league_history.py weekly_history.py nfl_points.py

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check the code before deploying
        run: |
          pip install --quiet boto3
          python -m py_compile $LAMBDA_FILES
          python -c "import lambda_function"
          python -m py_compile trade_lab.py trade_lab_store.py
          python -c "import trade_lab"
          python trade-lab/build.py trade-lab.html
          python trade-lab/build.py --tools tools.html
          python test_awards.py
          python test_boxscores.py
          python test_weekly_history.py
          python test_trade_lab.py
          node trade-lab/test_logic.js

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the code to Lambda
        run: |
          zip -j lambda.zip $LAMBDA_FILES landing.html *.webp
          zip -r lambda.zip rivalry-center/index.html rivalry-center/css rivalry-center/js rivalry-center/assets
          zip -r lambda.zip manager-career-center/index.html manager-career-center/css manager-career-center/js manager-career-center/assets manager-career-center/data/payouts.js
          zip -r lambda.zip record-room/index.html record-room/css record-room/js record-room/assets shared
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://lambda.zip > /dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          echo "Deployed $(date -u) from commit $GITHUB_SHA"

      # Trade Lab: its own Lambda (interactive API) and its own page, kept
      # apart from the weekly awards job above.
      - name: Upload the Trade Lab API
        run: |
          zip -j trade-lab-api.zip $LAMBDA_FILES trade_lab.py trade_lab_store.py
          aws lambda update-function-code --function-name "$TRADE_LAB_FUNCTION" --zip-file fileb://trade-lab-api.zip > /dev/null
          aws lambda wait function-updated --function-name "$TRADE_LAB_FUNCTION"
          if [ "$(aws lambda get-function-configuration --function-name "$TRADE_LAB_FUNCTION" --query Handler --output text)" != "trade_lab.handler" ]; then
            aws lambda update-function-configuration --function-name "$TRADE_LAB_FUNCTION" --handler trade_lab.handler > /dev/null
            aws lambda wait function-updated --function-name "$TRADE_LAB_FUNCTION"
          fi
          echo "Trade Lab API deployed $(date -u) from commit $GITHUB_SHA"

      - name: Publish the Trade Lab page
        run: |
          aws s3 cp trade-lab.html "s3://$SITE_BUCKET/trade-lab.html" \
            --content-type "text/html; charset=utf-8" --cache-control "max-age=300"
          aws s3 cp tools.html "s3://$SITE_BUCKET/tools.html" \
            --content-type "text/html; charset=utf-8" --cache-control "max-age=300"
